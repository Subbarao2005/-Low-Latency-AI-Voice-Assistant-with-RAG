version: "3.8"

# Deploy all three services in the SAME region/host as your OpenAI + Sarvam endpoints.
# Cross-region hops are the single biggest hidden latency cost in this architecture —
# see qa/QA_TEST_PLAN.md "Region check".

services:
  redis:
    image: redis:7-alpine
    container_name: voice-assistant-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"] # cache only, no durability needed
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: voice-assistant-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: voice-assistant-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - EXECUTIONS_MODE=regular
      - N8N_RUNNERS_ENABLED=true
      - GENERIC_TIMEZONE=UTC
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - SARVAM_API_KEY=${SARVAM_API_KEY}
      - SARVAM_TTS_STREAM_URL=${SARVAM_TTS_STREAM_URL}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL}
      - ACTION_ROUTER_URL=${ACTION_ROUTER_URL}
      
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - qdrant
      - redis

volumes:
  qdrant_storage:
  n8n_data:
